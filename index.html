<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- КТ4: БЭМ - Блок task-list -->
  <div class="task-list">
    <!-- КТ4: БЭМ - Элемент task-list__title -->
    <h1 class="task-list__title">Мои задачи</h1>

    <!-- КТ4: БЭМ - Элемент task-list__item -->
    <div class="task-list__item">
      <!-- КТ4: БЭМ - Элемент task-list__item-text -->
      <span class="task-list__item-text">Купить молоко</span>
      <!-- КТ4: БЭМ - Модификатор task-list__item-status--completed -->
      <span class="task-list__item-status task-list__item-status--completed">Выполнено</span>
    </div>

    <div class="task-list__item">
      <span class="task-list__item-text">Исправить баг</span>
      <span class="task-list__item-status task-list__item-status--pending">В процессе</span>
    </div>

    <!-- КТ4: БЭМ - Блок button с модификатором button--primary -->
    <button class="button button--primary">Добавить задачу</button>
  </div>

  <!-- Подключение скомпилированного JS -->
  <script src="dist/index.js"></script>
</body>
</html>
